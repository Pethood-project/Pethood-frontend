name: APK

# Arma el APK de la app mobile sin EAS: expo prebuild + Gradle en el runner de GitHub.
# El APK queda como artifact del run (pestaña Actions → el run → Artifacts).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    name: Mobile — APK release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    # EXPO_PUBLIC_* se hornean en el bundle JS durante assembleRelease. Se cargan como
    # Variables (no Secrets) en Settings → Secrets and variables → Actions: terminan legibles
    # dentro del APK de todas formas.
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que la URL de la API está cargada
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Falta la variable EXPO_PUBLIC_API_URL en Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      # Con un tag vX.Y.Z el APK sale con esa versión: expo.version = X.Y.Z y versionCode =
      # X*10000 + Y*100 + Z (sube siempre que sube el semver; Android no deja instalar encima
      # un versionCode menor). Sin tag (workflow_dispatch) se queda la versión de app.json.
      - name: Versionar el APK según el tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::El tag '${GITHUB_REF_NAME}' no es vX.Y.Z (ej. v1.2.3): no se puede derivar la versión"
              exit 1
            fi
            if [ "${BASH_REMATCH[2]}" -gt 99 ] || [ "${BASH_REMATCH[3]}" -gt 99 ]; then
              echo "::error::minor y patch tienen que ser <= 99 para que versionCode sea monótono"
              exit 1
            fi
            VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            node -e '
              const fs = require("fs");
              const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
              app.expo.version = process.argv[1];
              app.expo.android = { ...app.expo.android, versionCode: Number(process.argv[2]) };
              fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            ' "$VERSION" "$VERSION_CODE"
            echo "APK ${VERSION} (versionCode ${VERSION_CODE})"
          else
            VERSION=$(node -p 'require("./app.json").expo.version')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --no-install

      # Firma con el debug.keystore del template de Expo: sirve para instalar a mano,
      # no para Play Store. Para publicar, inyectar un keystore propio desde un secret.
      - name: Compilar APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: pethood-apk-${{ steps.version.outputs.version }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
